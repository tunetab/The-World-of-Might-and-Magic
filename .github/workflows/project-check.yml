name: Project Check

on:
  push:
  pull_request:

jobs:
  project-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24

      - name: Check project
        shell: pwsh
        run: .\tools\Проверить_проект.ps1

      - name: Check tools
        shell: pwsh
        run: .\tools\Проверить_инструменты.ps1

      - name: Check context and turn recovery
        shell: pwsh
        run: .\tools\Проверить_систему_v2.ps1

      - name: Check bounded connections and chronology
        shell: pwsh
        run: .\tools\Проверить_связи.ps1

      - name: Check intake integrity and Windows regressions
        shell: pwsh
        run: .\tools\Проверить_аудит.ps1
